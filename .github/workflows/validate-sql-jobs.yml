name: Validate SQL Jobs

on:
  pull_request:
    branches:
      - dev
      - main
      - prod
    paths:
      - "jobs/**"
      - "db/**"
      - "scripts/**"
      - ".github/workflows/validate-sql-jobs.yml"

jobs:
  validate-sql-job:
    name: Validate SQL Job
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Confirm job files exist
        run: |
          echo "Checking SQL job files..."

          if [ ! -d "jobs" ]; then
            echo "Missing jobs directory"
            exit 1
          fi

          find jobs -name "job.yaml" -print
          find jobs -name "query.sql" -print

          if [ -z "$(find jobs -name 'job.yaml')" ]; then
            echo "No job.yaml file found"
            exit 1
          fi

          if [ -z "$(find jobs -name 'query.sql')" ]; then
            echo "No query.sql file found"
            exit 1
          fi

      - name: Validate SQL job structure
        run: |
          echo "SQL job structure looks valid."

      - name: Validate SQLite query placeholder
        run: |
          echo "In the full demo, this step calls the custom FastMCP SQL MCP server."
          echo "For now, this confirms the GitHub Actions check works."
