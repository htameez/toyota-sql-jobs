name: Validate SQL Jobs

on:
  pull_request:
    branches:
      - dev
      - main
      - "release/*"
    paths:
      - "jobs/**"
      - "db/**"
      - ".github/workflows/validate-sql-jobs.yml"

jobs:
  validate-sql-jobs:
    name: Validate SQL Jobs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Confirm job and database files exist
        run: |
          if [ ! -d "jobs" ]; then
            echo "ERROR: No jobs directory found."
            exit 1
          fi

          if [ ! -f "db/dev_payments.db" ]; then
            echo "ERROR: db/dev_payments.db not found."
            exit 1
          fi

          echo "=== job.yaml files ==="
          find jobs -name "job.yaml" -print

          echo "=== query.sql files ==="
          find jobs -name "query.sql" -print

          if [ -z "$(find jobs -name 'job.yaml')" ]; then
            echo "ERROR: No job.yaml files found under jobs/"
            exit 1
          fi

          if [ -z "$(find jobs -name 'query.sql')" ]; then
            echo "ERROR: No query.sql files found under jobs/"
            exit 1
          fi

      - name: Validate job.yaml structure
        run: |
          python3 << 'EOF'
          import yaml
          import pathlib
          import sys

          REQUIRED_FIELDS = {"name", "type", "connector", "schedule", "sql_file"}

          errors = []

          for spec_file in pathlib.Path("jobs").rglob("job.yaml"):
              try:
                  doc = yaml.safe_load(spec_file.read_text())
              except yaml.YAMLError as e:
                  errors.append(f"FAIL {spec_file}: invalid YAML — {e}")
                  continue

              if not isinstance(doc, dict):
                  errors.append(f"FAIL {spec_file}: expected a YAML mapping at the top level")
                  continue

              missing = REQUIRED_FIELDS - doc.keys()
              if missing:
                  errors.append(f"FAIL {spec_file}: missing required fields: {sorted(missing)}")
                  continue

              if doc.get("type") not in {"sql", "scheduled_sql"}:
                  errors.append(f"FAIL {spec_file}: type must be 'sql' or 'scheduled_sql'")

              if doc.get("connector") != "sqlite":
                  errors.append(f"FAIL {spec_file}: connector must be 'sqlite' for current demo")

              if doc.get("sql_file") != "query.sql":
                  errors.append(f"FAIL {spec_file}: sql_file must be 'query.sql'")

              print(f"OK   {spec_file}")

          if errors:
              for err in errors:
                  print(err)
              sys.exit(1)
          EOF

      - name: Validate SQL syntax against dev_payments.db
        run: |
          python3 << 'EOF'
          import sqlite3
          import pathlib
          import sys

          DB_PATH = pathlib.Path("db/dev_payments.db")
          errors = []

          if not DB_PATH.exists():
              print(f"FAIL: database file {DB_PATH} does not exist")
              sys.exit(1)

          for sql_file in pathlib.Path("jobs").rglob("query.sql"):
              query = sql_file.read_text().strip()

              if not query:
                  errors.append(f"FAIL {sql_file}: query.sql is empty")
                  continue

              try:
                  conn = sqlite3.connect(str(DB_PATH))
                  conn.execute(f"EXPLAIN {query}")
                  conn.close()
                  print(f"OK   {sql_file}")
              except sqlite3.Error as e:
                  errors.append(f"FAIL {sql_file}: {e}")

          if errors:
              for err in errors:
                  print(err)
              sys.exit(1)
          EOF

      - name: Stricter checks for release branches
        if: startsWith(github.base_ref, 'release/')
        run: |
          python3 << 'EOF'
          import yaml
          import pathlib
          import sys

          errors = []

          for spec_file in pathlib.Path("jobs").rglob("job.yaml"):
              doc = yaml.safe_load(spec_file.read_text()) or {}

              if not doc.get("owner"):
                  errors.append(f"FAIL {spec_file}: owner is required for release branch PRs")

              if doc.get("environment") != "prod":
                  errors.append(f"FAIL {spec_file}: environment must be 'prod' for release branch PRs")

          if errors:
              for err in errors:
                  print(err)
              sys.exit(1)

          print("Release branch checks passed.")
          EOF
